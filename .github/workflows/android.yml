name: Build Dokeh Dar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.37

      - name: Prepare Buildozer
        run: |
          sed -i 's/^# *android.accept_sdk_license.*/android.accept_sdk_license = True/' buildozer.spec || true
          sed -i 's/^# *p4a.branch.*/p4a.branch = develop/' buildozer.spec || true

      - name: Download Android SDK and NDK through Buildozer
        run: |
          buildozer android p4a -- --help

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dokeh-Dar-APK
          path: bin/*.apk
          if-no-files-found: error
